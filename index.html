<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta http-equiv="X-UA-Compatible" content="ie=edge">
      <title>Nexus Academy Survey Form</title>
      <link rel="stylesheet" href="styles.css">      
    </head>
    <body>
        <h1>Nexus Academy Survey Form</h1>
        <form id="survey-form">
            <div class="form-section">
                <p>Welcome to Nexus Academy! Please fill out this quick survey.</p>
                <p>Your feedback helps us shape our discord community.</p>
            </div>
            <fieldset>
                <legend>What is your current skill level?</legend>
                <label>
                    <input type="radio" name="experience" value="beginner"> Absolute Beginner
                </label>
                <label>
                    <input type="radio" name="experience" value="intermediate"> Intermediate
                </label>
                <label>
                    <input type="radio" name="experience" value="proficient"> Proficient
                </label>
                <label>
                    <input type="radio" name="experience" value="advanced"> Advanced
                </label>
            </fieldset>
            <fieldset>
                <legend>What coding languages would you like to learn?</legend>
                <label>
                    <input type="checkbox" name="languages" value="python"> Python
                </label>
                <label>
                    <input type="checkbox" name="languages" value="javascript"> JavaScript
                </label>
                <label>
                    <input type="checkbox" name="languages" value="java"> Java
                </label>
                <label>
                    <input type="checkbox" name="languages" value="c++"> C++
                </label>
                <label>
                    <input type="checkbox" name="languages" value="typescript"> Typescript
                </label>
                <label>
                    <input type="checkbox" name="languages" valus="c#"> C#
                </label>
                <label>
                    <input type="checkbox" name="languages" value="php"> PHP
                </label>
                <label>
                    <input type="checkbox" name="languages" value="ruby"> Ruby
                </label>
                <label>
                    <input type="checkbox" name="languages" value="sql"> SQL
                </label>
                <label>
                    <input type="checkbox" name="languages" value="go"> Go
                </label>
                <label>
                    <input type="checkbox" name="languages" value="c"> C
                </label>
                <label>
                    <input type="checkbox" name="languages" value="rust"> Rust
                </label>
                <label>
                    <input type="checkbox" name="languages" value="swift"> Swift
                </label>
                <label>
                    <input type="checkbox" name="languages" value="kotlin"> Kotlin
                </label>
                <label>
                    <input type="checkbox" name="languages" value="other"> Other
                </label>
            </fieldset>
            <fieldset>
                <legend>Do you play any of these games?</legend>
                <label>
                    <input type="checkbox" name="games" value="codecombat"> CodeCombat    
                </label>
                <label>
                    <input type="checkbox" name="games" value="codewars"> Codewars
                </label>
                <label>
                    <input type="checkbox" name="games" value="codingame"> CodinGame
                </label>
                <label>
                    <input type="checkbox" name="games" value="bitburner"> Bitburner
                </label>
                <label>
                    <input type="checkbox" name="games" value="screeps"> Screeps
                </label>
                <label>
                    <input type="checkbox" name="games" value="other"> Other
                </label>
            </fieldset>
        </form>
    </body>
</html>
