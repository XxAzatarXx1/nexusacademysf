<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta http-equiv="X-UA-Compatible" content="ie=edge">
      <title>Nexus Academy Survey Form</title>
      <link rel="stylesheet" href="styles.css">      
    </head>
    <body>
        <h1>Nexus Academy Survey Form</h1>
        <form id="survey-form">
            <div class="form-section">
                <p>Welcome to Nexus Academy! Please fill out this quick survey.</p>
                <p>Your feedback helps us shape our discord community.</p>
            </div>
            <fieldset>
                <legend>What is your current skill level?</legend>
                <label>
                    <input type="radio" name="experience" value="beginner"> Absolute Beginner
                </label>
                <label>
                    <input type="radio" name="experience" value="intermediate"> Intermediate
                </label>
                <label>
                    <input type="radio" name="experience" value="proficient"> Proficient
                </label>
                <label>
                    <input type="radio" name="experience" value="advanced"> Advanced
                </label>
            </fieldset>
        </form>
    </body>
</html>
